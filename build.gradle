buildscript {
    repositories {
        maven { url = 'https://maven.parchmentmc.org' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        maven { url = 'https://maven.minecraftforge.net' }
        mavenLocal()
        mavenCentral()
    }
    dependencies {
        classpath "net.minecraftforge.gradle:ForgeGradle:5.1.74"
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
        classpath "org.parchmentmc:librarian:1.+"
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

def gameDirPath = project.file('1.19.2-run')

minecraft {
    minecraft.accessTransformer = file(ATFile)
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory gameDirPath
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
            workingDirectory new File(gameDirPath.getPath() + '/server')
        }

        gameTestServer {
            workingDirectory new File(gameDirPath.getPath() + '/gametest')
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory new File(gameDirPath.getPath() + '/run-data')

            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "mixins.${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }
tasks.named('compileJava'){
    doFirst {
        if(project.gradle.startParameter.taskNames.contains('build'))
            compileJava.source = compileJava.source.filter {
                File file -> !file.name.endsWith('BuildNBTFile.java')
            }
    }
}
repositories {
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven { // Registrate
        url "https://maven.tterrag.com/"
    }
    mavenLocal()
}
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    runtimeOnly fg.deobf("curse.maven:mekanism-268560:4644795")
    runtimeOnly fg.deobf("curse.maven:cyclops-core-232758:4681659")
    runtimeOnly fg.deobf("curse.maven:capabilityproxy-266479:3929855")
    compileOnly fg.deobf("com.tterrag.registrate:Registrate:${registrate_version}")
    implementation fg.deobf("curse.maven:create-328085:4835190")
    implementation fg.deobf("curse.maven:storage-drawers-223852:5648923")
    implementation fg.deobf("curse.maven:trash-cans-394535:4606893")
    implementation fg.deobf("curse.maven:supermartijn642s-config-lib-438332:4715406")
    implementation fg.deobf("curse.maven:supermartijn642s-core-lib-454372:4660114")
    implementation fg.deobf("curse.maven:sophisticated-core-618298:5296313")
    implementation fg.deobf("curse.maven:sophisticated-backpacks-422301:5194759")
    implementation fg.deobf("curse.maven:titanium-287342:5356458")
    implementation fg.deobf("curse.maven:functional-storage-556861:4992914")
    implementation fg.deobf("curse.maven:applied-energistics-2-223794:5014801")
    implementation fg.deobf("curse.maven:cobblefordays-349460:3975349")
    implementation fg.deobf("curse.maven:sophisticated-storage-619320:5194750")

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "Specification-Title": mod_id,
                "Specification-Vendor": mod_authors,
                "Specification-Version": "1", // We are version 1 of ourselves
                "Implementation-Title": project.name,
                "Implementation-Version": project.jar.archiveVersion,
                "Implementation-Vendor": mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

def GameTestConfig = project.properties.get('GameTestConfig','default')

tasks.register("prepareGameTestConfigs", Copy) {
    group = 'mod development'
    description = "Copy config files for GameTestServer"
    if(GameTestConfig != 'default') {
        def configFiles = project.file(GameTestConfigDir)
        if (!configFiles.exists() || !configFiles.isDirectory()) {
            throw new GradleException("config set directory '${configFiles}' does not exist for GameTestServer. ")
        }
        from fileTree("${configFiles}/${GameTestConfig}")
        into new File(gameDirPath.getPath(),'/gametest/config')
    }
}

tasks.configureEach { task ->
    if(task.name == 'runGameTestServer') {
        task.dependsOn(tasks.named('prepareGameTestConfigs').get())
    }
}
