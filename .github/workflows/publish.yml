name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - 1.20.1-6.0.0-forge
    paths:
      - src/*
      - gradle/*
      - .github/workflows/*
      - build.gradle
      - gradle.properties
      - settings.gradle

jobs:
  build-docker-image:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

#      - name: Extract metadata for Docker
#        id: meta
#        uses: docker/metadata-action@v5
#        with:
#          images: ghcr.io/${{ github.repository }}

      - name: Build and push Docker image
        run: gradle pushDockerImage
        env:
          PROJECT_NAME: ${{ github.repository }}

#      - name: Build and push Docker image
#        id: docker_build
#        uses: docker/build-push-action@v5
#        with:
#          context: .
#          file: ./Dockerfile
#          push: true # 关键：设置为 true 来推送镜像
#          tags: 1.20.1-forge
#          labels: ${{ steps.meta.outputs.labels }}

  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: build-docker-image
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

#      - name: Setup JDK 21
#        uses: actions/setup-java@v4
#        with:
#          java-version: '21'
#          distribution: 'temurin'
#
#      - name: Setup Gradle
#        uses: gradle/actions/setup-gradle@v4
#        with:
#          gradle-version: '8.11.1'

      - name: Build with Gradle
        run: gradle build

      - uses: Kir-Antipov/mc-publish@v3.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: 1.20.1-6.0.0-Forge_NeoForge
          github-draft: false
          github-prerelease: true

      - uses: actions/upload-artifact@v4
        with:
          name: Build Artifact
          include-hidden-files: true
          path: |
            **/logs/
            **/crash-reports/
            build/libs
          retention-days: 1
        if: always()
  GameTest:
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        GameTestConfig: [ default, testAE ]
    permissions:
      contents: write
    needs: build-docker-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

#      - name: Setup JDK 21
#        uses: actions/setup-java@v4
#        with:
#          java-version: '21'
#          distribution: 'temurin'
#
#      - name: Setup Gradle
#        uses: gradle/actions/setup-gradle@v4
#        with:
#          gradle-version: '8.11.1'

      - name: Test Server with ${{ matrix.GameTestConfig }}
        run: gradle runGameTestServer -PGameTestConfig=${{ matrix.GameTestConfig }}
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: Test Artifact of ${{ matrix.GameTestConfig }}
          include-hidden-files: true
          path: |
            **/logs/
            **/crash-reports/
            build/libs
          retention-days: 7
        if: always()